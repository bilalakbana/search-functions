# What sf's release package (sf-linux-x86_64.tar.gz) holds besides sf itself; read by packaging/build.py.
# Every download is pinned by URL and sha256, which the build checks. To move to a new version change the
# version, the URL and the sha256 together (fd, bat and delta publish no checksums, so their sha256 is
# taken from the download itself).

# The container ugrep is built in: static, against musl. The tag is for people, the digest is what counts.
alpine = "alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"

# Programs that go to lib/sf. `files` are paths inside the archive copied to lib/sf under their own name;
# `licenses` are the license files inside the archive; `license_urls` license texts fetched separately.

[[program]]
name = "fd"
version = "10.5.0"
license = "MIT OR Apache-2.0"
source = "https://github.com/sharkdp/fd"
url = "https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz"
sha256 = "761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7"
files = ["fd-v10.5.0-x86_64-unknown-linux-musl/fd"]
licenses = ["fd-v10.5.0-x86_64-unknown-linux-musl/LICENSE-APACHE", "fd-v10.5.0-x86_64-unknown-linux-musl/LICENSE-MIT"]
license_urls = []

[[program]]
name = "bat"
version = "0.26.1"
license = "MIT OR Apache-2.0"
source = "https://github.com/sharkdp/bat"
url = "https://github.com/sharkdp/bat/releases/download/v0.26.1/bat-v0.26.1-x86_64-unknown-linux-musl.tar.gz"
sha256 = "0dcd8ac79732c0d5b136f11f4ee00e581440e16a44eab5b3105b611bbf2cf191"
files = ["bat-v0.26.1-x86_64-unknown-linux-musl/bat"]
licenses = ["bat-v0.26.1-x86_64-unknown-linux-musl/LICENSE-APACHE", "bat-v0.26.1-x86_64-unknown-linux-musl/LICENSE-MIT"]
license_urls = []

[[program]]
name = "delta"
version = "0.20.1"
license = "MIT"
source = "https://github.com/dandavison/delta"
url = "https://github.com/dandavison/delta/releases/download/0.20.1/delta-0.20.1-x86_64-unknown-linux-musl.tar.gz"
sha256 = "69dcb4043f55c29118f408c6efd30115e0a4e0a6709253343b8c8fa814ab4a31"
files = ["delta-0.20.1-x86_64-unknown-linux-musl/delta"]
licenses = ["delta-0.20.1-x86_64-unknown-linux-musl/LICENSE"]
license_urls = []

# ugrep publishes no Linux binaries: its source archive is built in the Alpine container; ugrep, ug and the
# ugrep+ script (archives and documents, it runs `ug`) go to lib/sf.
[[program]]
name = "ugrep"
version = "7.8.5"
license = "BSD-3-Clause"
source = "https://github.com/Genivia/ugrep"
url = "https://github.com/Genivia/ugrep/archive/refs/tags/v7.8.5.tar.gz"
sha256 = "f080ab6cd9d96a5357570cb60a99e09ebe5eef11cf322c35373dbe815378a1f2"
build = "ugrep"
files = []
licenses = ["ugrep-7.8.5/LICENSE.txt"]
license_urls = []

# Libraries linked into the static ugrep from Alpine's packages (`apk` names the package; the build stops
# when Alpine has a different upstream version, so the license texts below stay the ones linked). musl is
# also in sf, which links the musl that comes with Rust's x86_64-unknown-linux-musl target.

